<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Debris Run — Editor</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: #080b18; color: #dfe7ff;
    font-family: 'Rajdhani', system-ui, sans-serif;
  }
  #app { display: flex; height: 100vh; overflow: hidden; }

  /* ---------- preview ---------- */
  #stage {
    flex: 1 1 auto; min-width: 0;
    display: flex; flex-direction: column; align-items: center;
    background: radial-gradient(circle at 50% 30%, #131a33 0%, #06080f 70%);
    padding: 12px; gap: 10px; overflow: auto;
  }
  #frameWrap {
    position: relative;
    border: 1px solid rgba(120,160,255,0.28);
    border-radius: 14px; overflow: hidden;
    box-shadow: 0 18px 60px rgba(0,0,0,0.6);
    background: #000;
    flex: 0 0 auto;
  }
  #game { display: block; border: 0; width: 420px; height: 800px; }
  #stageBar, #stageBar2 {
    display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
    max-width: 820px;
  }
  #readout {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 11px; line-height: 1.5; color: #8fa6d8;
    background: rgba(10,14,30,0.7); border: 1px solid rgba(120,160,255,0.18);
    border-radius: 8px; padding: 8px 10px; max-width: 820px; width: 100%;
    white-space: pre-wrap; word-break: break-word;
  }

  /* ---------- panel ---------- */
  #panel {
    flex: 0 0 430px; max-width: 48vw;
    background: #0c1122; border-left: 1px solid rgba(120,160,255,0.2);
    display: flex; flex-direction: column; overflow: hidden;
  }
  #panelHead {
    padding: 12px 14px 10px; border-bottom: 1px solid rgba(120,160,255,0.2);
    display: flex; flex-direction: column; gap: 8px;
  }
  h1 {
    font-family: 'Orbitron', sans-serif; font-size: 13px; letter-spacing: 2px;
    margin: 0; color: #7fe9ff;
  }
  #search {
    width: 100%; padding: 7px 10px; border-radius: 8px;
    border: 1px solid rgba(120,160,255,0.28); background: #060a16; color: #dfe7ff;
    font-family: inherit; font-size: 13px;
  }
  #panelBody { overflow-y: auto; padding: 4px 0 40px; flex: 1 1 auto; }

  details { border-bottom: 1px solid rgba(120,160,255,0.13); }
  summary {
    cursor: pointer; padding: 9px 14px; list-style: none;
    font-family: 'Orbitron', sans-serif; font-size: 10px; letter-spacing: 1.6px;
    color: #9fb6ee; background: rgba(255,255,255,0.02);
    display: flex; justify-content: space-between; align-items: center;
  }
  summary::-webkit-details-marker { display: none; }
  summary:hover { color: #7fe9ff; }
  summary .count { font-family: ui-monospace, monospace; opacity: 0.5; font-size: 10px; }
  .group-body { padding: 6px 14px 12px; }

  .row { display: block; margin-bottom: 9px; }
  .row label {
    display: block; font-size: 12.5px; color: #b8c8ee;
    margin-bottom: 3px; line-height: 1.3;
  }
  .ctl { display: flex; align-items: center; gap: 8px; }
  .row input[type=range] { flex: 1 1 auto; min-width: 0; accent-color: #4ff0ff; }
  .row input[type=number] {
    flex: 0 0 74px; padding: 4px 6px; font-size: 12px;
    border-radius: 6px; border: 1px solid rgba(120,160,255,0.28);
    background: #060a16; color: #dfe7ff; font-family: ui-monospace, monospace;
  }
  .row input[type=color] {
    flex: 0 0 42px; height: 26px; padding: 0; border: 1px solid rgba(120,160,255,0.28);
    border-radius: 6px; background: #060a16;
  }
  .row input[type=text] {
    flex: 1 1 auto; min-width: 0; padding: 4px 6px; font-size: 12px;
    border-radius: 6px; border: 1px solid rgba(120,160,255,0.28);
    background: #060a16; color: #dfe7ff; font-family: ui-monospace, monospace;
  }
  .row.changed label { color: #ffd479; }
  .row.changed label::after { content: ' •'; color: #ffd479; }

  button, select {
    font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 12px;
    letter-spacing: 0.4px; padding: 6px 11px; border-radius: 8px;
    border: 1px solid rgba(120,160,255,0.35); background: rgba(79,240,255,0.09);
    color: #cfe6ff; cursor: pointer;
  }
  button:hover { background: rgba(79,240,255,0.2); border-color: #4ff0ff; }
  button.warn { border-color: rgba(255,120,140,0.45); background: rgba(255,80,110,0.12); color: #ffc3cf; }
  button.on { background: #4ff0ff; color: #04121a; border-color: #4ff0ff; }
  select { background: #060a16; }
  .sub { font-size: 11px; color: #6d80ad; padding: 0 14px 10px; line-height: 1.5; }
  #err {
    display: none; margin: 10px 14px; padding: 10px; border-radius: 8px;
    background: rgba(255,80,110,0.12); border: 1px solid rgba(255,120,140,0.45);
    color: #ffc3cf; font-size: 12.5px; line-height: 1.5;
  }
  @media (max-width: 900px) {
    #app { flex-direction: column; }
    #panel { flex: 1 1 auto; max-width: none; border-left: 0; border-top: 1px solid rgba(120,160,255,0.2); }
    #game { width: 320px; height: 610px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="stageBar"></div>
    <div id="frameWrap"><iframe id="game" src="index.html" title="Game preview"></iframe></div>
    <div id="stageBar2"></div>
    <div id="readout">connecting…</div>
  </div>

  <div id="panel">
    <div id="panelHead">
      <h1>DEBRIS RUN — EDITOR</h1>
      <input id="search" type="search" placeholder="filter properties…" autocomplete="off">
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button id="btnExport">Copy JSON</button>
        <button id="btnImport">Paste JSON</button>
        <button id="btnReset" class="warn">Reset all</button>
      </div>
    </div>
    <div id="err"></div>
    <div class="sub" id="hint">Changes apply live. They are saved in this browser and survive a restart of the preview.</div>
    <div id="panelBody"></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var frame = document.getElementById('game');
  var panelBody = document.getElementById('panelBody');
  var readout = document.getElementById('readout');
  var errBox = document.getElementById('err');
  var api = null;
  var rows = [];          // every control, for filtering + change marks
  var STORE = 'debrisRunTuning';

  // ---- how each tunable is presented. Anything in TUNE without an entry here
  // ---- still gets a control, inferred from its default value.
  var META = {
    darkColorR: null, darkColorG: null, darkColorB: null, // folded into a colour picker
    lightRes:              { g: 'Lighting', min: 0.15, max: 1, step: 0.05, label: 'Light buffer resolution' },
    maxShadowLights:       { g: 'Lighting', min: 0, max: 40, step: 1, label: 'Max shadow-casting lights' },
    maxCastersPerLight:    { g: 'Lighting', min: 0, max: 30, step: 1, label: 'Max casters per light' },
    shadowSoftness:        { g: 'Lighting', min: 0, max: 0.3, step: 0.005, label: 'Shadow edge softness' },
    penumbraStrength:      { g: 'Lighting', min: 0, max: 1, step: 0.05, label: 'Penumbra strength' },
    shadowReach:           { g: 'Lighting', min: 1, max: 6, step: 0.1, label: 'Shadow length' },
    starfieldBrightness:   { g: 'Lighting', min: 0, max: 3, step: 0.05, label: 'Starfield brightness' },
    starfieldStride:       { g: 'Lighting', min: 1, max: 8, step: 1, label: 'Starfield thinning (every Nth)' },

    lampRadius:            { g: 'Ship lamps', min: 10, max: 400, step: 2, label: 'Wing lamp radius' },
    lampIntensity:         { g: 'Ship lamps', min: 0, max: 2, step: 0.02, label: 'Wing lamp intensity' },
    lampWingDX:            { g: 'Ship lamps', min: 0, max: 40, step: 1, label: 'Lamp X offset' },
    lampWingDY:            { g: 'Ship lamps', min: -20, max: 40, step: 1, label: 'Lamp Y offset' },
    navLightRadius:        { g: 'Ship lamps', min: 0, max: 120, step: 2, label: 'Nav light radius' },
    navLightIntensity:     { g: 'Ship lamps', min: 0, max: 2, step: 0.02, label: 'Nav light intensity' },

    bulletLightRadius:       { g: 'Light sources', min: 0, max: 200, step: 2, label: 'Bullet light radius' },
    bulletLightIntensity:    { g: 'Light sources', min: 0, max: 1.5, step: 0.01, label: 'Bullet light intensity' },
    enemyBulletLightRadius:  { g: 'Light sources', min: 0, max: 200, step: 2, label: 'Enemy bullet radius' },
    enemyBulletLightIntensity:{ g: 'Light sources', min: 0, max: 1.5, step: 0.01, label: 'Enemy bullet intensity' },
    bombLightRadius:         { g: 'Light sources', min: 0, max: 300, step: 2, label: 'Bomb light radius' },
    bombLightIntensity:      { g: 'Light sources', min: 0, max: 2, step: 0.02, label: 'Bomb light intensity' },
    rocketLightRadius:       { g: 'Light sources', min: 0, max: 300, step: 2, label: 'Rocket light radius' },
    rocketLightIntensity:    { g: 'Light sources', min: 0, max: 2, step: 0.02, label: 'Rocket light intensity' },
    sunLightScale:           { g: 'Light sources', min: 0, max: 5, step: 0.05, label: 'Sun light reach ×' },
    sunLightIntensity:       { g: 'Light sources', min: 0, max: 2, step: 0.02, label: 'Sun light intensity' },
    mineLightRadius:         { g: 'Light sources', min: 0, max: 200, step: 2, label: 'Mine beacon radius' },
    mineLightIntensity:      { g: 'Light sources', min: 0, max: 2, step: 0.02, label: 'Mine beacon intensity' },
    chargerLightRadius:      { g: 'Light sources', min: 0, max: 200, step: 2, label: 'Charger glow radius' },
    chargerLightIntensity:   { g: 'Light sources', min: 0, max: 2, step: 0.02, label: 'Charger glow intensity' },
    flashLightScale:         { g: 'Light sources', min: 0, max: 12, step: 0.1, label: 'Explosion flash reach ×' },
    emberLightIntensity:     { g: 'Light sources', min: 0, max: 2, step: 0.02, label: 'Debris ember intensity' },

    l3HyperspeedTime:  { g: 'Level 3', min: 0.2, max: 10, step: 0.1, label: 'Hyperspeed duration' },
    l3ArriveTime:      { g: 'Level 3', min: 0.2, max: 10, step: 0.1, label: 'Darkness fall duration' },
    l3TransitDuration: { g: 'Level 3', min: 5, max: 400, step: 5, label: 'Dark transit length' },
    l3SunriseTime:     { g: 'Level 3', min: 1, max: 20, step: 0.5, label: 'Sunrise duration' },
    l3Reward:          { g: 'Level 3', min: 0, max: 20000, step: 100, label: 'Clear reward' },

    l2TriggerTime:     { g: 'Level 2 fleet', min: 5, max: 300, step: 5, label: 'Time until fleet jump' },
    l2ChargeupTime:    { g: 'Level 2 fleet', min: 0.2, max: 10, step: 0.1, label: 'Chargeup duration' },
    l2HyperspeedTime:  { g: 'Level 2 fleet', min: 0.2, max: 10, step: 0.1, label: 'Hyperspeed duration' },
    l2ArriveTime:      { g: 'Level 2 fleet', min: 0.2, max: 10, step: 0.1, label: 'Arrival duration' },
    l2BattleDuration:  { g: 'Level 2 fleet', min: 5, max: 300, step: 5, label: 'Spawning phase length' },
    l2EnemyInterval:   { g: 'Level 2 fleet', min: 0.05, max: 4, step: 0.05, label: 'Enemy spawn interval' },
    l2AllyInterval:    { g: 'Level 2 fleet', min: 0.2, max: 12, step: 0.1, label: 'Ally spawn interval' },
    l2MaxEnemies:      { g: 'Level 2 fleet', min: 1, max: 80, step: 1, label: 'Max concurrent enemies' },
    l2MaxAllies:       { g: 'Level 2 fleet', min: 0, max: 30, step: 1, label: 'Max concurrent allies' },
    l2Reward:          { g: 'Level 2 fleet', min: 0, max: 20000, step: 100, label: 'Clear reward' },
    battleAllyHp:      { g: 'Level 2 fleet', min: 1, max: 20, step: 1, label: 'Ally hit points' },
    battleAllyFireMin: { g: 'Level 2 fleet', min: 0.05, max: 2, step: 0.01, label: 'Ally fire delay (min)' },
    battleAllyFireMax: { g: 'Level 2 fleet', min: 0.05, max: 3, step: 0.01, label: 'Ally fire delay (max)' },
    battleAllySpeed:   { g: 'Level 2 fleet', min: 20, max: 500, step: 5, label: 'Ally speed' },
    battleAllyHoldDist:{ g: 'Level 2 fleet', min: 20, max: 400, step: 5, label: 'Ally stand-off distance' },
    battleAllySeparation:{ g: 'Level 2 fleet', min: 0, max: 160, step: 2, label: 'Ally separation' },

    superbossTime:     { g: 'Void Titan', min: 10, max: 400, step: 5, label: 'Time until Titan' },

    rockIntervalBase:  { g: 'Spawning', min: 0.1, max: 8, step: 0.05, label: 'Asteroid interval' },
    enemyIntervalBase: { g: 'Spawning', min: 0.1, max: 12, step: 0.1, label: 'Enemy interval' },
    hazardIntervalBase:{ g: 'Spawning', min: 2, max: 90, step: 1, label: 'Hazard interval' },
    nebulaIntervalBase:{ g: 'Spawning', min: 2, max: 90, step: 1, label: 'Nebula interval' },

    playerFireInterval:{ g: 'Player', min: 0.03, max: 1, step: 0.01, label: 'Fire interval' },
    playerRadius:      { g: 'Player', min: 4, max: 60, step: 1, label: 'Hitbox radius' },
    joystickSpeed:     { g: 'Player', min: 60, max: 1200, step: 10, label: 'Joystick speed' }
  };

  var GROUP_ORDER = ['Darkness', 'Lighting', 'Ship lamps', 'Light sources', 'Level 3',
                     'Level 2 fleet', 'Void Titan', 'Spawning', 'Player', 'Other',
                     'Enemies', 'Hazards', 'Difficulty', 'Titan phases'];

  // ---------- helpers ----------
  function clamp255(n) { return Math.max(0, Math.min(255, Math.round(n))); }
  function toHex(r, g, b) {
    return '#' + [r, g, b].map(function (c) {
      return clamp255(c).toString(16).padStart(2, '0');
    }).join('');
  }
  function fromHex(hex) {
    var m = /^#?([0-9a-f]{6})$/i.exec(hex.trim());
    if (!m) return null;
    var n = parseInt(m[1], 16);
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
  }
  function isHexColor(v) { return typeof v === 'string' && /^#[0-9a-f]{3,8}$/i.test(v); }

  function loadStore() {
    try { return JSON.parse(localStorage.getItem(STORE) || '{}'); } catch (e) { return {}; }
  }
  function saveTune(key, value) {
    var s = loadStore();
    s[key] = value;
    try { localStorage.setItem(STORE, JSON.stringify(s)); } catch (e) {}
  }
  function clearStore() { try { localStorage.removeItem(STORE); } catch (e) {} }

  // ---------- control builders ----------
  function makeGroup(name) {
    var d = document.createElement('details');
    d.open = (name === 'Darkness' || name === 'Lighting');
    var sum = document.createElement('summary');
    sum.innerHTML = '<span>' + name + '</span><span class="count"></span>';
    var body = document.createElement('div');
    body.className = 'group-body';
    d.appendChild(sum);
    d.appendChild(body);
    panelBody.appendChild(d);
    return { el: d, body: body, count: sum.querySelector('.count'), name: name };
  }

  function register(groupObj, rowEl, labelText, isChanged) {
    var rec = { row: rowEl, group: groupObj, text: labelText.toLowerCase(), changed: isChanged };
    rows.push(rec);
    return rec;
  }

  function markChanged(rec, changed) {
    rec.changed = changed;
    rec.row.classList.toggle('changed', !!changed);
  }

  function numberRow(group, key, value, meta, onSet, isDefaultFn) {
    var row = document.createElement('div');
    row.className = 'row';
    var lab = document.createElement('label');
    lab.textContent = meta.label || key;
    lab.title = key;
    var range = document.createElement('input');
    range.type = 'range';
    range.min = meta.min; range.max = meta.max; range.step = meta.step;
    range.value = value;
    var num = document.createElement('input');
    num.type = 'number';
    num.step = meta.step; num.value = value;

    var rec;
    function apply(v, from) {
      v = parseFloat(v);
      if (isNaN(v)) return;
      if (from !== 'range') range.value = v;
      if (from !== 'num') num.value = v;
      onSet(v);
      markChanged(rec, !isDefaultFn(v));
    }
    range.addEventListener('input', function () { apply(range.value, 'range'); });
    num.addEventListener('change', function () { apply(num.value, 'num'); });

    var ctl = document.createElement('div');
    ctl.className = 'ctl';
    ctl.appendChild(range); ctl.appendChild(num);
    row.appendChild(lab); row.appendChild(ctl);
    group.body.appendChild(row);
    rec = register(group, row, (meta.label || key) + ' ' + key, !isDefaultFn(value));
    markChanged(rec, rec.changed);
    return { set: function (v) { apply(v, null); } };
  }

  function colorRow(group, labelText, getHex, onHex, isDefaultFn) {
    var row = document.createElement('div');
    row.className = 'row';
    var lab = document.createElement('label');
    lab.textContent = labelText;
    var col = document.createElement('input');
    col.type = 'color'; col.value = getHex();
    var txt = document.createElement('input');
    txt.type = 'text'; txt.value = getHex();
    var rec;
    function apply(hex) {
      var c = fromHex(hex);
      if (!c) return;
      col.value = toHex(c.r, c.g, c.b);
      txt.value = col.value;
      onHex(c);
      markChanged(rec, !isDefaultFn(col.value));
    }
    col.addEventListener('input', function () { apply(col.value); });
    txt.addEventListener('change', function () { apply(txt.value); });
    var ctlc = document.createElement('div');
    ctlc.className = 'ctl';
    ctlc.appendChild(col); ctlc.appendChild(txt);
    row.appendChild(lab); row.appendChild(ctlc);
    group.body.appendChild(row);
    rec = register(group, row, labelText, !isDefaultFn(col.value));
    markChanged(rec, rec.changed);
    return { set: apply };
  }

  function textRow(group, labelText, value, onSet, isDefaultFn, title) {
    var row = document.createElement('div');
    row.className = 'row';
    var lab = document.createElement('label');
    lab.textContent = labelText;
    if (title) lab.title = title;
    var inp = document.createElement('input');
    inp.type = 'text'; inp.value = value;
    var rec;
    inp.addEventListener('change', function () {
      onSet(inp.value);
      markChanged(rec, !isDefaultFn(inp.value));
    });
    var ctlt = document.createElement('div');
    ctlt.className = 'ctl';
    ctlt.appendChild(inp);
    row.appendChild(lab); row.appendChild(ctlt);
    group.body.appendChild(row);
    rec = register(group, row, labelText + ' ' + (title || ''), !isDefaultFn(value));
    markChanged(rec, rec.changed);
    return { set: function (v) { inp.value = v; } };
  }

  // ---------- build the whole panel ----------
  var setters = {};

  function buildTuneControls() {
    var tune = api.tune, defaults = api.defaults;
    var groups = {};
    function group(name) {
      if (!groups[name]) groups[name] = makeGroup(name);
      return groups[name];
    }

    // Ambient colour gets one picker rather than three raw channels.
    var dark = group('Darkness');
    setters.__darkColor = colorRow(dark, 'Dark ambient colour',
      function () { return toHex(tune.darkColorR, tune.darkColorG, tune.darkColorB); },
      function (c) {
        api.set('darkColorR', c.r); api.set('darkColorG', c.g); api.set('darkColorB', c.b);
        saveTune('darkColorR', c.r); saveTune('darkColorG', c.g); saveTune('darkColorB', c.b);
      },
      function (hex) { return hex.toLowerCase() === toHex(defaults.darkColorR, defaults.darkColorG, defaults.darkColorB); });

    Object.keys(tune).forEach(function (key) {
      if (key.indexOf('darkColor') === 0) return;
      var meta = META[key];
      if (meta === null) return;
      var v = tune[key];
      if (typeof v !== 'number') return;
      if (!meta) {
        var mag = Math.abs(v) || 1;
        meta = { g: 'Other', min: 0, max: +(mag * 4).toFixed(3), step: mag < 2 ? 0.01 : 1, label: key };
      }
      setters[key] = numberRow(group(meta.g), key, v, meta,
        function (nv) { api.set(key, nv); saveTune(key, nv); },
        function (nv) { return nv === defaults[key]; });
    });

    // ---- data collections: every enemy, hazard, difficulty and Titan phase ----
    var col = api.collections;

    var enemyGroup = group('Enemies');
    Object.keys(col.ENEMY_KINDS).forEach(function (kind) {
      var def = col.ENEMY_KINDS[kind];
      var sub = document.createElement('div');
      sub.style.cssText = 'font-family:Orbitron,sans-serif;font-size:9px;letter-spacing:1.4px;color:#7fe9ff;margin:10px 0 5px';
      sub.textContent = (def.name || kind).toUpperCase();
      enemyGroup.body.appendChild(sub);
      register(enemyGroup, sub, kind + ' ' + (def.name || ''), false);
      buildObjectRows(enemyGroup, col.ENEMY_KINDS, 'ENEMY_KINDS.' + kind, def, kind);
    });

    var hazGroup = group('Hazards');
    Object.keys(col.HAZARD_DEFAULTS).forEach(function (type) {
      var def = col.HAZARD_DEFAULTS[type];
      var sub = document.createElement('div');
      sub.style.cssText = 'font-family:Orbitron,sans-serif;font-size:9px;letter-spacing:1.4px;color:#7fe9ff;margin:10px 0 5px';
      sub.textContent = (def.name || type).toUpperCase();
      hazGroup.body.appendChild(sub);
      register(hazGroup, sub, type + ' ' + (def.name || ''), false);
      buildObjectRows(hazGroup, col.HAZARD_DEFAULTS, 'HAZARD_DEFAULTS.' + type, def, type);
    });
    buildObjectRows(hazGroup, col.HAZARD_UNLOCK, 'HAZARD_UNLOCK', col.HAZARD_UNLOCK, 'unlock at (s)');

    var diffGroup = group('Difficulty');
    Object.keys(col.DIFFICULTIES).forEach(function (name) {
      var d = col.DIFFICULTIES[name];
      var sub = document.createElement('div');
      sub.style.cssText = 'font-family:Orbitron,sans-serif;font-size:9px;letter-spacing:1.4px;color:#7fe9ff;margin:10px 0 5px';
      sub.textContent = name.toUpperCase();
      diffGroup.body.appendChild(sub);
      register(diffGroup, sub, name, false);
      buildObjectRows(diffGroup, col.DIFFICULTIES, 'DIFFICULTIES.' + name, d, name);
    });

    var phaseGroup = group('Titan phases');
    Object.keys(col.SUPERBOSS_PHASES).forEach(function (p) {
      var ph = col.SUPERBOSS_PHASES[p];
      var sub = document.createElement('div');
      sub.style.cssText = 'font-family:Orbitron,sans-serif;font-size:9px;letter-spacing:1.4px;color:#7fe9ff;margin:10px 0 5px';
      sub.textContent = 'PHASE ' + p;
      phaseGroup.body.appendChild(sub);
      register(phaseGroup, sub, 'phase ' + p, false);
      buildObjectRows(phaseGroup, col.SUPERBOSS_PHASES, 'SUPERBOSS_PHASES.' + p, ph, 'phase' + p);
    });

    // order the groups
    GROUP_ORDER.forEach(function (n) { if (groups[n]) panelBody.appendChild(groups[n].el); });
    Object.keys(groups).forEach(function (n) {
      if (GROUP_ORDER.indexOf(n) === -1) panelBody.appendChild(groups[n].el);
    });
    Object.keys(groups).forEach(function (n) {
      var g = groups[n];
      g.count.textContent = g.body.querySelectorAll('.row').length;
    });
  }

  // Renders every editable leaf of a collection entry (numbers, colours, strings,
  // and [min,max] pairs like an enemy's speed range).
  function buildObjectRows(group, rootObj, path, obj, prefix) {
    Object.keys(obj).forEach(function (k) {
      var v = obj[k];
      var full = path + '.' + k;
      if (typeof v === 'function') return;
      if (Array.isArray(v) && v.length === 2 && typeof v[0] === 'number') {
        [0, 1].forEach(function (idx) {
          var mag = Math.abs(v[idx]) || 1;
          var orig = v[idx];
          setters[full + '[' + idx + ']'] = numberRow(group, full,
            v[idx],
            { min: 0, max: +(Math.max(mag * 4, 10)).toFixed(2), step: mag < 3 ? 0.01 : 1,
              label: prefix + ' · ' + k + (idx ? ' max' : ' min') },
            function (nv) { v[idx] = nv; },
            function (nv) { return nv === orig; });
        });
        return;
      }
      if (typeof v === 'number') {
        var mag = Math.abs(v) || 1;
        var orig0 = v;
        setters[full] = numberRow(group, full, v,
          { min: 0, max: +(Math.max(mag * 4, 4)).toFixed(2), step: mag < 3 ? 0.01 : 1,
            label: prefix + ' · ' + k },
          function (nv) { obj[k] = nv; },
          function (nv) { return nv === orig0; });
        return;
      }
      if (isHexColor(v)) {
        var origC = v;
        colorRow(group, prefix + ' · ' + k,
          function () { return v.length === 7 ? v : '#ffffff'; },
          function (c) { obj[k] = toHex(c.r, c.g, c.b); },
          function (hex) { return hex.toLowerCase() === origC.toLowerCase(); });
        return;
      }
      if (typeof v === 'string') {
        var origS = v;
        textRow(group, prefix + ' · ' + k, v,
          function (nv) { obj[k] = nv; },
          function (nv) { return nv === origS; }, full);
      }
    });
  }

  // ---------- stage controls ----------
  function btn(parent, label, fn, cls) {
    var b = document.createElement('button');
    b.textContent = label;
    if (cls) b.className = cls;
    b.addEventListener('click', fn);
    parent.appendChild(b);
    return b;
  }

  function buildStageBar() {
    var bar = document.getElementById('stageBar');
    var bar2 = document.getElementById('stageBar2');
    bar.innerHTML = ''; bar2.innerHTML = '';

    btn(bar, 'Level 1', function () { api.actions.start(1); });
    btn(bar, 'Level 2', function () { api.actions.start(2); });
    btn(bar, 'Level 3', function () { api.actions.start(3); });
    btn(bar, 'Restart', function () { api.actions.restart(); });
    btn(bar, 'Reload preview', function () { frame.src = frame.src; api = null; });

    var invOn = false;
    var invBtn = btn(bar, 'Invincible', function () {
      invOn = !invOn; api.actions.invincible(invOn); invBtn.classList.toggle('on', invOn);
    });
    var frzOn = false;
    var frzBtn = btn(bar, 'Freeze spawns', function () {
      frzOn = !frzOn; api.actions.freezeSpawns(frzOn); frzBtn.classList.toggle('on', frzOn);
    });

    var eSel = document.createElement('select');
    api.enemyKinds().forEach(function (k) {
      var o = document.createElement('option'); o.value = k; o.textContent = k; eSel.appendChild(o);
    });
    bar2.appendChild(eSel);
    btn(bar2, 'Spawn enemy', function () { api.actions.spawnEnemy(eSel.value); });

    var hSel = document.createElement('select');
    api.hazardTypes().forEach(function (k) {
      var o = document.createElement('option'); o.value = k; o.textContent = k; hSel.appendChild(o);
    });
    bar2.appendChild(hSel);
    btn(bar2, 'Spawn hazard', function () { api.actions.spawnHazard(hSel.value); });

    btn(bar2, 'Power-up', function () { api.actions.spawnPowerUp(); });
    btn(bar2, '+5 ammo', function () { api.actions.giveBombs(5); });
    btn(bar2, 'Clear field', function () { api.actions.clearField(); });
    btn(bar2, 'Fleet battle now', function () { api.actions.skipToLevel2Battle(); });
    btn(bar2, 'Sunrise now', function () { api.actions.skipToLevel3Sunrise(); });

    var darkRow = document.createElement('span');
    darkRow.style.cssText = 'display:flex;align-items:center;gap:5px;font-size:12px;color:#8fa6d8';
    darkRow.innerHTML = '<span>darkness</span>';
    var dk = document.createElement('input');
    dk.type = 'range'; dk.min = 0; dk.max = 1; dk.step = 0.02; dk.value = 0;
    dk.style.width = '90px';
    dk.addEventListener('input', function () { api.actions.setDark(parseFloat(dk.value)); });
    darkRow.appendChild(dk);
    bar2.appendChild(darkRow);
  }

  // ---------- live readout ----------
  function tick() {
    if (api) {
      try {
        var st = api.state();
        readout.textContent =
          'state ' + st.state + '   level ' + st.level + '   score ' + st.score + '   lives ' + st.lives +
          '   t ' + st.elapsed + 's   ammo ' + st.bombs + '\n' +
          'dark ' + st.darkAmbient + '   lightRes ' + st.lightRes + '   frame ' + st.frameMs + 'ms' +
          '   lights ' + st.lights + '   occluders ' + st.occluders + '\n' +
          'enemies ' + st.enemies + '   rocks ' + st.rocks + '   allies ' + st.allies +
          '   hazards [' + st.hazards.join(', ') + ']\n' +
          'L3 ' + st.level3State + '   L2boss ' + st.level2BossState + '   titan ' + st.superbossState;
      } catch (e) { /* preview mid-reload */ }
    }
    requestAnimationFrame(tick);
  }

  // ---------- connect ----------
  function connect() {
    var w;
    try { w = frame.contentWindow; } catch (e) { w = null; }
    if (!w || !w.__editor) return false;
    api = w.__editor;
    panelBody.innerHTML = '';
    rows = [];
    setters = {};
    buildTuneControls();
    buildStageBar();
    errBox.style.display = 'none';
    return true;
  }

  var tries = 0;
  function waitForGame() {
    if (connect()) return;
    if (++tries > 60) {
      errBox.style.display = 'block';
      errBox.innerHTML = 'Could not reach the game preview.<br><br>' +
        'If you opened this file directly from disk, the browser blocks the editor from ' +
        'talking to the iframe. Serve the folder over http instead — from the project ' +
        'folder run <code>python3 -m http.server</code> and open ' +
        '<code>http://localhost:8000/editor.html</code>. On the live site it works as-is.';
      return;
    }
    setTimeout(waitForGame, 250);
  }
  frame.addEventListener('load', function () { tries = 0; waitForGame(); });
  waitForGame();
  tick();

  // ---------- filter ----------
  document.getElementById('search').addEventListener('input', function (e) {
    var q = e.target.value.trim().toLowerCase();
    rows.forEach(function (r) {
      r.row.style.display = (!q || r.text.indexOf(q) !== -1) ? '' : 'none';
    });
    if (q) {
      panelBody.querySelectorAll('details').forEach(function (d) { d.open = true; });
    }
  });

  // ---------- import / export / reset ----------
  document.getElementById('btnExport').addEventListener('click', function () {
    var out = JSON.stringify(loadStore(), null, 2);
    navigator.clipboard.writeText(out).then(function () {
      var b = document.getElementById('btnExport');
      var old = b.textContent; b.textContent = 'Copied ✓';
      setTimeout(function () { b.textContent = old; }, 1200);
    }, function () { window.prompt('Copy your tuning JSON:', out); });
  });

  document.getElementById('btnImport').addEventListener('click', function () {
    var txt = window.prompt('Paste tuning JSON:');
    if (!txt) return;
    var obj;
    try { obj = JSON.parse(txt); } catch (e) { alert('That is not valid JSON.'); return; }
    Object.keys(obj).forEach(function (k) {
      if (api.set(k, obj[k])) saveTune(k, obj[k]);
    });
    connect();
  });

  document.getElementById('btnReset').addEventListener('click', function () {
    if (!confirm('Reset every tuning value back to the built-in defaults?')) return;
    clearStore();
    api.resetTune();
    connect();
  });
})();
</script>
</body>
</html>
