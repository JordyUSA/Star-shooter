<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Debris Run — Editor</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: #080b18; color: #dfe7ff;
    font-family: 'Rajdhani', system-ui, sans-serif;
  }
  #app { display: flex; height: 100vh; overflow: hidden; }

  /* ---------- preview ---------- */
  #stage {
    flex: 1 1 auto; min-width: 0;
    display: flex; flex-direction: column; align-items: center;
    background: radial-gradient(circle at 50% 30%, #131a33 0%, #06080f 70%);
    padding: 12px; gap: 10px; overflow: auto;
  }
  #frameWrap {
    position: relative;
    border: 1px solid rgba(120,160,255,0.28);
    border-radius: 14px; overflow: hidden;
    box-shadow: 0 18px 60px rgba(0,0,0,0.6);
    background: #000;
    flex: 0 0 auto;
  }
  #game { display: block; border: 0; width: 420px; height: 800px; }
  #stageBar, #stageBar2 {
    display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
    max-width: 860px;
  }
  #readout {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 11px; line-height: 1.5; color: #8fa6d8;
    background: rgba(10,14,30,0.7); border: 1px solid rgba(120,160,255,0.18);
    border-radius: 8px; padding: 8px 10px; max-width: 860px; width: 100%;
    white-space: pre-wrap; word-break: break-word;
  }

  /* ---------- panel ---------- */
  #panel {
    flex: 0 0 440px; max-width: 48vw;
    background: #0c1122; border-left: 1px solid rgba(120,160,255,0.2);
    display: flex; flex-direction: column; overflow: hidden;
  }
  #panelHead {
    padding: 12px 14px 10px; border-bottom: 1px solid rgba(120,160,255,0.2);
    display: flex; flex-direction: column; gap: 8px;
  }
  h1 {
    font-family: 'Orbitron', sans-serif; font-size: 13px; letter-spacing: 2px;
    margin: 0; color: #7fe9ff;
  }
  #search {
    width: 100%; padding: 7px 10px; border-radius: 8px;
    border: 1px solid rgba(120,160,255,0.28); background: #060a16; color: #dfe7ff;
    font-family: inherit; font-size: 13px;
  }
  #panelBody { overflow-y: auto; padding: 4px 0 40px; flex: 1 1 auto; }

  details { border-bottom: 1px solid rgba(120,160,255,0.13); }
  summary {
    cursor: pointer; padding: 9px 14px; list-style: none;
    font-family: 'Orbitron', sans-serif; font-size: 10px; letter-spacing: 1.6px;
    color: #9fb6ee; background: rgba(255,255,255,0.02);
    display: flex; justify-content: space-between; align-items: center;
    position: sticky; top: 0; z-index: 2;
  }
  summary::-webkit-details-marker { display: none; }
  summary:hover { color: #7fe9ff; }
  summary .count { font-family: ui-monospace, monospace; opacity: 0.5; font-size: 10px; }
  .group-body { padding: 6px 14px 12px; }
  .group-note {
    font-size: 11.5px; line-height: 1.5; color: #7d90bd;
    border-left: 2px solid rgba(127,233,255,0.35); padding: 2px 0 2px 8px;
    margin: 2px 0 10px;
  }

  .row { display: block; margin-bottom: 11px; }
  .row label {
    display: block; font-size: 12.5px; color: #b8c8ee;
    margin-bottom: 2px; line-height: 1.3;
  }
  .row .help {
    display: block; font-size: 11px; line-height: 1.45;
    color: #6f83b0; margin-bottom: 4px;
  }
  .row .help .cost { color: #e8a94f; }
  .ctl { display: flex; align-items: center; gap: 8px; }
  .row input[type=range] { flex: 1 1 auto; min-width: 0; accent-color: #4ff0ff; }
  .row input[type=number] {
    flex: 0 0 76px; padding: 4px 6px; font-size: 12px;
    border-radius: 6px; border: 1px solid rgba(120,160,255,0.28);
    background: #060a16; color: #dfe7ff; font-family: ui-monospace, monospace;
  }
  .row input[type=color] {
    flex: 0 0 42px; height: 26px; padding: 0; border: 1px solid rgba(120,160,255,0.28);
    border-radius: 6px; background: #060a16;
  }
  .row input[type=text] {
    flex: 1 1 auto; min-width: 0; padding: 4px 6px; font-size: 12px;
    border-radius: 6px; border: 1px solid rgba(120,160,255,0.28);
    background: #060a16; color: #dfe7ff; font-family: ui-monospace, monospace;
  }
  .row .undo {
    flex: 0 0 auto; visibility: hidden; padding: 2px 6px; font-size: 11px;
    line-height: 1.3; border-radius: 5px;
  }
  .row.changed label { color: #ffd479; }
  .row.changed label::after { content: ' •'; color: #ffd479; }
  .row.changed .undo { visibility: visible; }

  .subhead {
    font-family: 'Orbitron', sans-serif; font-size: 9px; letter-spacing: 1.4px;
    color: #7fe9ff; margin: 14px 0 6px; padding-top: 8px;
    border-top: 1px solid rgba(120,160,255,0.12);
  }

  button, select {
    font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 12px;
    letter-spacing: 0.4px; padding: 6px 11px; border-radius: 8px;
    border: 1px solid rgba(120,160,255,0.35); background: rgba(79,240,255,0.09);
    color: #cfe6ff; cursor: pointer;
  }
  button:hover { background: rgba(79,240,255,0.2); border-color: #4ff0ff; }
  button.warn { border-color: rgba(255,120,140,0.45); background: rgba(255,80,110,0.12); color: #ffc3cf; }
  button.on { background: #4ff0ff; color: #04121a; border-color: #4ff0ff; }
  select { background: #060a16; }
  .sub { font-size: 11px; color: #6d80ad; padding: 0 14px 10px; line-height: 1.5; }
  #err {
    display: none; margin: 10px 14px; padding: 10px; border-radius: 8px;
    background: rgba(255,80,110,0.12); border: 1px solid rgba(255,120,140,0.45);
    color: #ffc3cf; font-size: 12.5px; line-height: 1.5;
  }
  #err code { color: #ffe7a8; }
  @media (max-width: 900px) {
    #app { flex-direction: column; }
    #panel { flex: 1 1 auto; max-width: none; border-left: 0; border-top: 1px solid rgba(120,160,255,0.2); }
    #game { width: 320px; height: 610px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="stageBar"></div>
    <div id="frameWrap"><iframe id="game" src="index.html" title="Game preview"></iframe></div>
    <div id="stageBar2"></div>
    <div id="readout">connecting…</div>
  </div>

  <div id="panel">
    <div id="panelHead">
      <h1>DEBRIS RUN — EDITOR</h1>
      <input id="search" type="search" placeholder="filter properties…" autocomplete="off">
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button id="btnExport">Copy JSON</button>
        <button id="btnImport">Paste JSON</button>
        <button id="btnFast" title="Lowest-cost settings that still look like the game">Fast preset</button>
        <button id="btnPretty" title="Everything on, for a machine that can take it">Pretty preset</button>
        <button id="btnReset" class="warn">Reset all</button>
      </div>
    </div>
    <div id="err"></div>
    <div class="sub" id="hint">Changes apply live and are saved in this browser, so they survive reloading the
      preview. A dot marks anything you have changed from the default — click <b>↺</b> to put just that one back.</div>
    <div id="panelBody"></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var frame = document.getElementById('game');
  var panelBody = document.getElementById('panelBody');
  var readout = document.getElementById('readout');
  var errBox = document.getElementById('err');
  var api = null;
  var rows = [];          // every control, for filtering
  var TUNE_STORE = 'debrisRunTuning';
  var COLLECTION_STORE = 'debrisRunCollections';

  // ---- What every tunable does. `g` groups it, `h` explains it. Anything in
  // ---- TUNE without an entry still gets a control, inferred from its value.
  var META = {
    darkColorR: null, darkColorG: null, darkColorB: null, // folded into one colour picker

    // ---------- performance ----------
    maxPixelRatio: { g: 'Performance', min: 0.5, max: 4, step: 0.25, label: 'Max pixel ratio',
      h: 'Caps how many real pixels the game draws per screen pixel. A phone reporting 3× renders <span class="cost">nine times</span> the pixels of 1× for a difference few people can see. <b>The single biggest performance setting.</b> 2 is a good ceiling; 1 is fastest.' },
    renderScale: { g: 'Performance', min: 0.4, max: 1.5, step: 0.05, label: 'Render scale',
      h: 'Multiplies the resolution again on top of the cap. Below 1 the picture softens but every fill, glow and gradient gets cheaper by the <span class="cost">square</span> of it — 0.75 costs about half as much as 1.' },
    autoQuality: { g: 'Performance', min: 0, max: 1, step: 1, label: 'Auto quality (0/1)',
      h: 'Lets the game watch its own frame time and give things up when it falls behind: lighting detail first, then glows, then resolution. Turn off to hold exactly the settings you picked and see the true cost.' },
    glowQuality: { g: 'Performance', min: 0, max: 1.5, step: 0.05, label: 'Glow amount',
      h: 'Scales every blurred glow — ships, bullets, bosses, pickups. Blur is the <span class="cost">most expensive</span> thing the canvas does, so 0 is a large speed-up and mostly costs you bloom.' },
    starDensity: { g: 'Performance', min: 0, max: 2, step: 0.05, label: 'Star density',
      h: 'How thickly the background starfield is seeded, relative to normal.' },
    maxStars: { g: 'Performance', min: 20, max: 800, step: 10, label: 'Star limit',
      h: 'Hard ceiling on stars however big the window is. Without it a desktop window carries several times a phone’s count on top of several times the pixels.' },
    dustDensity: { g: 'Performance', min: 0, max: 2, step: 0.05, label: 'Dust density',
      h: 'The fast-moving speck layer that sells the sense of speed.' },
    maxDust: { g: 'Performance', min: 0, max: 1200, step: 20, label: 'Dust limit',
      h: 'Hard ceiling on dust specks. Each is cheap, but a big window used to draw over a thousand of them every frame.' },
    bgCloudDensity: { g: 'Performance', min: 0, max: 2, step: 0.05, label: 'Background cloud density',
      h: 'The huge soft gas clouds drifting far behind everything. They are baked into sprites once, so a few more is not costly — but each still covers a lot of screen.' },
    fgCloudDensity: { g: 'Performance', min: 0, max: 2, step: 0.05, label: 'Foreground cloud density',
      h: 'The brighter coloured clouds that pass in <i>front</i> of the ship on level 2.' },
    maxParticles: { g: 'Performance', min: 40, max: 1500, step: 20, label: 'Particle limit',
      h: 'Ceiling on explosion sparks. Over it, the oldest are dropped so the blast you just triggered is the one that survives.' },
    maxDebris: { g: 'Performance', min: 20, max: 800, step: 10, label: 'Debris limit',
      h: 'Ceiling on the tumbling wreckage left by kills. Same oldest-first rule.' },
    showFps: { g: 'Performance', min: 0, max: 1, step: 1, label: 'Show fps meter (0/1)',
      h: 'Draws a live readout in the corner of the game: frame rate, frame time, the real canvas size, and what auto-quality has decided. Turn this on while tuning anything above.' },

    // ---------- darkness ----------
    lightRes: { g: 'Lighting', min: 0.15, max: 1, step: 0.05, label: 'Light buffer resolution',
      h: 'Level 3’s darkness is built in an off-screen buffer at this fraction of screen size. Lower is much cheaper and slightly softer — light is blurry anyway, so this is a cheap saving.' },
    maxShadowLights: { g: 'Lighting', min: 0, max: 40, step: 1, label: 'Max shadow-casting lights',
      h: 'How many lights may throw real shadows at once. The biggest lights get first claim; the rest still light the scene, they just do not cast. <span class="cost">Costly</span> — each one is a separate render pass.' },
    maxCastersPerLight: { g: 'Lighting', min: 0, max: 30, step: 1, label: 'Max casters per light',
      h: 'How many objects can throw a shadow from any one light. Nearest first.' },
    shadowSoftness: { g: 'Lighting', min: 0, max: 0.3, step: 0.005, label: 'Shadow edge softness',
      h: 'How far the half-shadow splays out past the hard umbra. Higher reads as a fuzzier, more distant light.' },
    penumbraStrength: { g: 'Lighting', min: 0, max: 1, step: 0.05, label: 'Penumbra strength',
      h: 'How dark that soft outer edge gets. 1 makes it as black as the core shadow, removing the soft falloff.' },
    shadowReach: { g: 'Lighting', min: 1, max: 6, step: 0.1, label: 'Shadow length',
      h: 'How far a shadow is thrown, as a multiple of the light’s own radius. Must stay above 1 or shadows stop short of the light’s edge and visibly clip.' },
    starfieldBrightness: { g: 'Lighting', min: 0, max: 3, step: 0.05, label: 'Starfield brightness in the dark',
      h: 'Stars are self-luminous, so they are laid back over the darkness rather than blacked out with everything else. This is how strongly.' },
    starfieldStride: { g: 'Lighting', min: 1, max: 8, step: 1, label: 'Starfield thinning',
      h: 'Draw only every Nth star during the dark pass. 2 halves the cost of that pass at almost no visible loss.' },

    lampRadius: { g: 'Ship lamps', min: 10, max: 400, step: 2, label: 'Wing lamp radius',
      h: 'How far the pool of light at each wingtip reaches — effectively how much of the dark you can see into.' },
    lampIntensity: { g: 'Ship lamps', min: 0, max: 2, step: 0.02, label: 'Wing lamp intensity',
      h: 'How bright that pool is at its centre.' },
    lampWingDX: { g: 'Ship lamps', min: 0, max: 40, step: 1, label: 'Lamp spacing',
      h: 'How far out from the hull centreline the two lamps sit.' },
    lampWingDY: { g: 'Ship lamps', min: -20, max: 40, step: 1, label: 'Lamp forward offset',
      h: 'Where along the hull they sit. Negative puts them ahead of the ship.' },
    navLightRadius: { g: 'Ship lamps', min: 0, max: 120, step: 2, label: 'Nav light radius',
      h: 'The small red (port) and green (starboard) marker lights, like an aircraft’s. Just enough to tint the hull’s surroundings.' },
    navLightIntensity: { g: 'Ship lamps', min: 0, max: 2, step: 0.02, label: 'Nav light intensity',
      h: 'Brightness of those two coloured markers.' },

    bulletLightRadius: { g: 'Light sources', min: 0, max: 200, step: 2, label: 'Your bullet — light radius',
      h: 'Tracer fire briefly lights what it flies past.' },
    bulletLightIntensity: { g: 'Light sources', min: 0, max: 1.5, step: 0.01, label: 'Your bullet — intensity',
      h: 'Keep this low: there can be a lot of bullets, and each one is a light.' },
    enemyBulletLightRadius: { g: 'Light sources', min: 0, max: 200, step: 2, label: 'Enemy bullet — light radius',
      h: 'How far incoming fire lights the dark. Raising it makes level 3 much more readable.' },
    enemyBulletLightIntensity: { g: 'Light sources', min: 0, max: 1.5, step: 0.01, label: 'Enemy bullet — intensity',
      h: 'How brightly incoming fire announces itself.' },
    bombLightRadius: { g: 'Light sources', min: 0, max: 300, step: 2, label: 'Bomb — light radius', h: 'Glow around a bomb in flight.' },
    bombLightIntensity: { g: 'Light sources', min: 0, max: 2, step: 0.02, label: 'Bomb — intensity', h: 'How brightly a live bomb burns.' },
    rocketLightRadius: { g: 'Light sources', min: 0, max: 300, step: 2, label: 'Rocket — light radius', h: 'Glow around a homing rocket’s motor.' },
    rocketLightIntensity: { g: 'Light sources', min: 0, max: 2, step: 0.02, label: 'Rocket — intensity', h: 'How brightly that motor burns.' },
    sunLightScale: { g: 'Light sources', min: 0, max: 5, step: 0.05, label: 'Sun — light reach ×',
      h: 'Multiplies a sun’s lit radius against its heat radius. Suns are the only thing out here that lights the whole field, so this strongly shapes level 3.' },
    sunLightIntensity: { g: 'Light sources', min: 0, max: 2, step: 0.02, label: 'Sun — light intensity', h: 'How hard a sun pushes back the dark.' },
    mineLightRadius: { g: 'Light sources', min: 0, max: 200, step: 2, label: 'Mine beacon radius',
      h: 'A mine’s blinking beacon is what gives it away before it reaches you.' },
    mineLightIntensity: { g: 'Light sources', min: 0, max: 2, step: 0.02, label: 'Mine beacon intensity', h: 'How bright that blink is at its peak.' },
    chargerLightRadius: { g: 'Light sources', min: 0, max: 200, step: 2, label: 'Charger glow radius',
      h: 'The glow a charger builds while it locks on. This is your warning before it dashes.' },
    chargerLightIntensity: { g: 'Light sources', min: 0, max: 2, step: 0.02, label: 'Charger glow intensity', h: 'How bright that warning gets.' },
    flashLightScale: { g: 'Light sources', min: 0, max: 12, step: 0.1, label: 'Explosion flash reach ×', h: 'How far an explosion throws light, relative to its own size.' },
    emberLightIntensity: { g: 'Light sources', min: 0, max: 2, step: 0.02, label: 'Debris ember intensity', h: 'Fresh wreckage glows hot for a moment after a kill. This is how much light it gives off.' },

    // ---------- suns ----------
    sunCoreColor: { g: 'Suns', label: 'Core colour', h: 'The hottest centre of the disc.' },
    sunGlowColor: { g: 'Suns', label: 'Disc colour', h: 'The body of the sun around that core, and the inner corona.' },
    sunCoronaColor: { g: 'Suns', label: 'Corona colour', h: 'The wide halo bleeding off into space.' },
    sunFlareColor: { g: 'Suns', label: 'Flare colour', h: 'The rotating spikes of light.' },
    sunLightColor: { g: 'Suns', label: 'Cast light colour', h: 'What colour a sun actually paints the world in during level 3 — separate from how the sun itself looks.' },
    sunFlareCount: { g: 'Suns', min: 0, max: 12, step: 1, label: 'Flare count', h: 'How many spikes. 0 removes them.' },
    sunFlareLength: { g: 'Suns', min: 0.5, max: 8, step: 0.1, label: 'Flare length', h: 'Spike length as a multiple of the sun’s radius.' },

    // ---------- level 3 ----------
    l3HyperspeedTime: { g: 'Level 3', min: 0.2, max: 10, step: 0.1, label: 'Hyperspeed duration (s)', h: 'Length of the warp-streak jump into the unlit reach.' },
    l3ArriveTime: { g: 'Level 3', min: 0.2, max: 10, step: 0.1, label: 'Darkness fall duration (s)', h: 'How long the light takes to drain away on arrival.' },
    l3TransitDuration: { g: 'Level 3', min: 5, max: 400, step: 5, label: 'Dark transit length (s)', h: 'How long you must survive in the dark before dawn. <b>The length of the level.</b>' },
    l3SunriseTime: { g: 'Level 3', min: 1, max: 20, step: 0.5, label: 'Sunrise duration (s)', h: 'Length of the closing sunrise once you have crossed.' },
    l3Reward: { g: 'Level 3', min: 0, max: 20000, step: 100, label: 'Clear reward', h: 'Score for surviving the crossing.' },

    // ---------- level 2 ----------
    l2TriggerTime: { g: 'Level 2 fleet', min: 5, max: 300, step: 5, label: 'Time until fleet jump (s)', h: 'Seconds of ordinary level-2 play before the fleet battle begins.' },
    l2ChargeupTime: { g: 'Level 2 fleet', min: 0.2, max: 10, step: 0.1, label: 'Chargeup duration (s)', h: 'The wind-up beat before the jump.' },
    l2HyperspeedTime: { g: 'Level 2 fleet', min: 0.2, max: 10, step: 0.1, label: 'Hyperspeed duration (s)', h: 'Length of the warp itself.' },
    l2ArriveTime: { g: 'Level 2 fleet', min: 0.2, max: 10, step: 0.1, label: 'Arrival duration (s)', h: 'The beat where you drop out of warp into the battle.' },
    l2BattleDuration: { g: 'Level 2 fleet', min: 5, max: 300, step: 5, label: 'Spawning phase length (s)',
      h: 'How long the enemy fleet keeps reinforcing. After this it stops and you clear the stragglers to win.' },
    l2EnemyInterval: { g: 'Level 2 fleet', min: 0.05, max: 4, step: 0.05, label: 'Enemy spawn interval (s)', h: 'Seconds between enemy arrivals. <b>The main difficulty dial</b> for the battle.' },
    l2AllyInterval: { g: 'Level 2 fleet', min: 0.2, max: 12, step: 0.1, label: 'Ally spawn interval (s)', h: 'Seconds between friendly arrivals.' },
    l2MaxEnemies: { g: 'Level 2 fleet', min: 1, max: 80, step: 1, label: 'Max concurrent enemies', h: 'Ceiling on the enemy side. Also a performance ceiling.' },
    l2MaxAllies: { g: 'Level 2 fleet', min: 0, max: 30, step: 1, label: 'Max concurrent allies', h: 'Ceiling on your side.' },
    l2Reward: { g: 'Level 2 fleet', min: 0, max: 20000, step: 100, label: 'Clear reward', h: 'Score for annihilating the armada.' },
    battleAllyHp: { g: 'Level 2 fleet', min: 1, max: 20, step: 1, label: 'Ally hit points', h: 'How much punishment a battle ally takes before it dies.' },
    battleAllyFireMin: { g: 'Level 2 fleet', min: 0.05, max: 2, step: 0.01, label: 'Ally fire delay — min (s)', h: 'Fastest an ally will shoot.' },
    battleAllyFireMax: { g: 'Level 2 fleet', min: 0.05, max: 3, step: 0.01, label: 'Ally fire delay — max (s)', h: 'Slowest. The gap between the two keeps the fleet from firing in lockstep.' },
    battleAllySpeed: { g: 'Level 2 fleet', min: 20, max: 500, step: 5, label: 'Ally speed', h: 'How fast allies move to engage.' },
    battleAllyHoldDist: { g: 'Level 2 fleet', min: 20, max: 400, step: 5, label: 'Ally stand-off distance', h: 'How close an ally tries to get before holding station and shooting.' },
    battleAllySeparation: { g: 'Level 2 fleet', min: 0, max: 160, step: 2, label: 'Ally separation', h: 'How hard allies push apart from each other, so the squadron spreads instead of stacking.' },

    // ---------- mini-bosses ----------
    bossFirstAt: { g: 'Mini-bosses', min: 5, max: 300, step: 5, label: 'First boss at (s)', h: 'When the first mini-boss appears in a run.' },
    bossRepeatBase: { g: 'Mini-bosses', min: 10, max: 300, step: 5, label: 'Gap between bosses (s)', h: 'Base delay before the next one after a kill.' },
    bossRepeatGrowth: { g: 'Mini-bosses', min: 0, max: 60, step: 1, label: 'Gap growth per boss (s)', h: 'Added to that gap for each boss already beaten, so they thin out as the run goes on.' },
    bossHpBulwark: { g: 'Mini-bosses', min: 5, max: 400, step: 5, label: 'BULWARK hit points', h: 'Health of the red boss — the one with the burst-and-radial pattern.' },
    bossHpWarden: { g: 'Mini-bosses', min: 5, max: 400, step: 5, label: 'WARDEN hit points', h: 'Health of the purple boss — the one that summons escorts.' },
    bossHpGrowth: { g: 'Mini-bosses', min: 0, max: 120, step: 5, label: 'Hit points added per boss', h: 'How much tougher each successive boss is. Difficulty multiplies this again.' },
    bossRadius: { g: 'Mini-bosses', min: 12, max: 120, step: 2, label: 'Size', h: 'Hull radius — both how big it looks and how easily you hit it.' },
    bossTargetY: { g: 'Mini-bosses', min: 0.05, max: 0.6, step: 0.01, label: 'Hover height', h: 'Where it settles, as a fraction down the screen. Lower numbers keep it further from you.' },
    bossDriftMin: { g: 'Mini-bosses', min: 0, max: 300, step: 5, label: 'Side drift — min', h: 'Slowest it tracks side to side.' },
    bossDriftMax: { g: 'Mini-bosses', min: 0, max: 400, step: 5, label: 'Side drift — max', h: 'Fastest. Picked at random between the two on spawn.' },
    bossRewardBase: { g: 'Mini-bosses', min: 0, max: 5000, step: 50, label: 'Kill reward', h: 'Score for the first mini-boss.' },
    bossRewardGrowth: { g: 'Mini-bosses', min: 0, max: 2000, step: 25, label: 'Reward growth per boss', h: 'Added for each one already beaten.' },

  // ---------- helpers ----------
  function clamp255(n) { return Math.max(0, Math.min(255, Math.round(n))); }
  function toHex(r, g, b) {
    return '#' + [r, g, b].map(function (c) {
      return clamp255(c).toString(16).padStart(2, '0');
    }).join('');
  }
  function fromHex(hex) {
    var m = /^#?([0-9a-f]{6})$/i.exec(String(hex).trim());
    if (!m) return null;
    var n = parseInt(m[1], 16);
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
  }
  function isHexColor(v) { return typeof v === 'string' && /^#[0-9a-f]{3,8}$/i.test(v); }

  function loadStore(key) {
    try { return JSON.parse(localStorage.getItem(key) || '{}'); } catch (e) { return {}; }
  }
  function writeStore(key, obj) {
    try { localStorage.setItem(key, JSON.stringify(obj)); } catch (e) {}
  }
  function saveTune(k, v) { var s = loadStore(TUNE_STORE); s[k] = v; writeStore(TUNE_STORE, s); }
  function dropTune(k) { var s = loadStore(TUNE_STORE); delete s[k]; writeStore(TUNE_STORE, s); }
  function savePath(p, v) { var s = loadStore(COLLECTION_STORE); s[p] = v; writeStore(COLLECTION_STORE, s); }
  function dropPath(p) { var s = loadStore(COLLECTION_STORE); delete s[p]; writeStore(COLLECTION_STORE, s); }
  function clearStores() {
    try { localStorage.removeItem(TUNE_STORE); localStorage.removeItem(COLLECTION_STORE); } catch (e) {}
  }

  // ---------- control builders ----------
  function makeGroup(name) {
    var d = document.createElement('details');
    d.open = (name === 'Performance');
    var sum = document.createElement('summary');
    sum.innerHTML = '<span>' + name + '</span><span class="count"></span>';
    var body = document.createElement('div');
    body.className = 'group-body';
    if (GROUP_NOTES[name]) {
      var note = document.createElement('div');
      note.className = 'group-note';
      note.innerHTML = GROUP_NOTES[name];
      body.appendChild(note);
    }
    d.appendChild(sum);
    d.appendChild(body);
    panelBody.appendChild(d);
    return { el: d, body: body, count: sum.querySelector('.count'), name: name };
  }

  function register(group, rowEl, searchText) {
    var rec = { row: rowEl, group: group, text: String(searchText).toLowerCase() };
    rows.push(rec);
    return rec;
  }

  // One row = label, explanation, control, and a revert button that appears only
  // once the value differs from the built-in default.
  function buildRow(group, labelText, helpHtml, searchText) {
    var row = document.createElement('div');
    row.className = 'row';
    var lab = document.createElement('label');
    lab.textContent = labelText;
    row.appendChild(lab);
    if (helpHtml) {
      var help = document.createElement('div');
      help.className = 'help';
      help.innerHTML = helpHtml;
      row.appendChild(help);
    }
    var ctl = document.createElement('div');
    ctl.className = 'ctl';
    row.appendChild(ctl);
    group.body.appendChild(row);
    register(group, row, searchText);
    return { row: row, ctl: ctl, label: lab };
  }

  function numberControl(group, meta, value, dflt, onSet, onRevert) {
    var built = buildRow(group, meta.label, meta.h, (meta.label || '') + ' ' + (meta.h || '') + ' ' + (meta.key || ''));
    var range = document.createElement('input');
    range.type = 'range';
    range.min = meta.min; range.max = meta.max; range.step = meta.step;
    var num = document.createElement('input');
    num.type = 'number';
    num.step = meta.step;
    var undo = document.createElement('button');
    undo.className = 'undo'; undo.textContent = '↺'; undo.title = 'Back to default (' + dflt + ')';

    function paint(v) {
      range.value = v; num.value = v;
      built.row.classList.toggle('changed', v !== dflt);
    }
    function apply(v, from) {
      v = parseFloat(v);
      if (isNaN(v)) { paint(parseFloat(num.value) || dflt); return; }
      if (from !== 'range') range.value = v;
      if (from !== 'num') num.value = v;
      built.row.classList.toggle('changed', v !== dflt);
      onSet(v);
    }
    range.addEventListener('input', function () { apply(range.value, 'range'); });
    num.addEventListener('change', function () { apply(num.value, 'num'); });
    undo.addEventListener('click', function () { paint(dflt); onRevert(dflt); });

    paint(value);
    built.ctl.appendChild(range);
    built.ctl.appendChild(num);
    built.ctl.appendChild(undo);
    return { set: paint };
  }

  function colorControl(group, meta, value, dflt, onSet, onRevert) {
    var built = buildRow(group, meta.label, meta.h, (meta.label || '') + ' ' + (meta.h || '') + ' ' + (meta.key || ''));
    var col = document.createElement('input');
    col.type = 'color';
    var txt = document.createElement('input');
    txt.type = 'text';
    var undo = document.createElement('button');
    undo.className = 'undo'; undo.textContent = '↺'; undo.title = 'Back to default (' + dflt + ')';

    function paint(hex) {
      col.value = hex; txt.value = hex;
      built.row.classList.toggle('changed', hex.toLowerCase() !== String(dflt).toLowerCase());
    }
    function apply(hex) {
      var c = fromHex(hex);
      if (!c) { paint(col.value); return; }
      var norm = toHex(c.r, c.g, c.b);
      paint(norm);
      onSet(norm, c);
    }
    col.addEventListener('input', function () { apply(col.value); });
    txt.addEventListener('change', function () { apply(txt.value); });
    undo.addEventListener('click', function () { paint(dflt); onRevert(dflt); });

    paint(value);
    built.ctl.appendChild(col);
    built.ctl.appendChild(txt);
    built.ctl.appendChild(undo);
    return { set: paint };
  }

  function textControl(group, meta, value, dflt, onSet, onRevert) {
    var built = buildRow(group, meta.label, meta.h, (meta.label || '') + ' ' + value);
    var inp = document.createElement('input');
    inp.type = 'text';
    var undo = document.createElement('button');
    undo.className = 'undo'; undo.textContent = '↺'; undo.title = 'Back to default (' + dflt + ')';
    function paint(v) {
      inp.value = v;
      built.row.classList.toggle('changed', v !== dflt);
    }
    inp.addEventListener('change', function () { paint(inp.value); onSet(inp.value); });
    undo.addEventListener('click', function () { paint(dflt); onRevert(dflt); });
    paint(value);
    built.ctl.appendChild(inp);
    built.ctl.appendChild(undo);
    return { set: paint };
  }

  function subhead(group, text) {
    var el = document.createElement('div');
    el.className = 'subhead';
    el.textContent = text;
    group.body.appendChild(el);
    register(group, el, text);
  }

  // ---------- build the panel ----------
  function buildPanel() {
    var tune = api.tune, defaults = api.defaults;
    var groups = {};
    function group(name) {
      if (!groups[name]) groups[name] = makeGroup(name);
      return groups[name];
    }

    // The three ambient channels are one colour, not three sliders.
    var dark = group('Darkness');
    (function () {
      var dfltHex = toHex(defaults.darkColorR, defaults.darkColorG, defaults.darkColorB);
      colorControl(dark,
        { label: 'Dark ambient colour', key: 'darkColor',
          h: 'The colour everything fades to where no light reaches. Not pure black — this is what gives level 3 its deep-space blue rather than a flat void.' },
        toHex(tune.darkColorR, tune.darkColorG, tune.darkColorB), dfltHex,
        function (hex, c) {
          ['R', 'G', 'B'].forEach(function (ch, i) {
            var k = 'darkColor' + ch, v = [c.r, c.g, c.b][i];
            api.set(k, v);
            if (v === defaults[k]) dropTune(k); else saveTune(k, v);
          });
        },
        function (hex) {
          var c = fromHex(hex);
          ['R', 'G', 'B'].forEach(function (ch, i) {
            api.set('darkColor' + ch, [c.r, c.g, c.b][i]);
            dropTune('darkColor' + ch);
          });
        });
    })();

    Object.keys(tune).forEach(function (key) {
      if (key.indexOf('darkColor') === 0) return;
      var meta = META[key];
      if (meta === null) return;
      var v = tune[key];
      if (!meta) {
        var mag = Math.abs(v) || 1;
        meta = { g: 'Other', min: 0, max: +(mag * 4).toFixed(3), step: mag < 2 ? 0.01 : 1,
                 label: key, h: 'No description written for this one yet.' };
      }
      meta.key = key;
      var g = group(meta.g || 'Other');
      var onSet = function (nv) {
        api.set(key, nv);
        if (nv === defaults[key]) dropTune(key); else saveTune(key, nv);
      };
      var onRevert = function () { api.set(key, defaults[key]); dropTune(key); };
      if (isHexColor(v)) colorControl(g, meta, v, defaults[key], onSet, onRevert);
      else if (typeof v === 'number') numberControl(g, meta, v, defaults[key], onSet, onRevert);
      else if (typeof v === 'string') textControl(g, meta, v, defaults[key], onSet, onRevert);
    });

    // ---- the game's data collections ----
    var col = api.collections, colDef = api.collectionDefaults;

    buildCollection(group('Enemies'), col.ENEMY_KINDS, colDef.ENEMY_KINDS, 'ENEMY_KINDS', ENEMY_HELP);
    buildCollection(group('Hazards'), col.HAZARD_DEFAULTS, colDef.HAZARD_DEFAULTS, 'HAZARD_DEFAULTS', HAZARD_HELP);
    subhead(group('Hazards'), 'FIRST APPEARANCE');
    buildLeaves(group('Hazards'), col.HAZARD_UNLOCK, colDef.HAZARD_UNLOCK, 'HAZARD_UNLOCK', 'unlock',
      { '*': 'Seconds into a run before this hazard can appear at all.' });
    buildCollection(group('Power-up kinds'), col.POWERUP_KINDS, colDef.POWERUP_KINDS, 'POWERUP_KINDS', POWERUP_HELP);
    buildCollection(group('Difficulty'), col.DIFFICULTIES, colDef.DIFFICULTIES, 'DIFFICULTIES', DIFFICULTY_HELP);
    buildCollection(group('Boss patterns'), col.BOSS_PATTERNS, colDef.BOSS_PATTERNS, 'BOSS_PATTERNS', PATTERN_HELP);
    buildCollection(group('Titan phases'), col.SUPERBOSS_PHASES, colDef.SUPERBOSS_PHASES, 'SUPERBOSS_PHASES', PATTERN_HELP);

    GROUP_ORDER.forEach(function (n) { if (groups[n]) panelBody.appendChild(groups[n].el); });
    Object.keys(groups).forEach(function (n) {
      if (GROUP_ORDER.indexOf(n) === -1) panelBody.appendChild(groups[n].el);
    });
    Object.keys(groups).forEach(function (n) {
      groups[n].count.textContent = groups[n].body.querySelectorAll('.row').length;
    });
  }

  };
  var POWERUP_HELP = {
    name: 'Label shown when collected.',
    color: 'Pickup colour and its collection sparks.',
    icon: 'The glyph drawn on the pickup.'
  };
  var DIFFICULTY_HELP = {
    label: 'Text on the difficulty button.',
    startLives: 'Lives you begin with.',
    speedMult: 'Multiplies enemy and asteroid speed.',
    enemyFireMult: 'Multiplies the delay between enemy shots — <b>higher means they shoot less</b>.',
    spawnMult: 'Multiplies spawn intervals — <b>higher means fewer</b> enemies.',
    scoreMult: 'Multiplies all score earned.',
    bossHpMult: 'Multiplies every boss’s health.',
    hazardMult: 'Multiplies hazard frequency.',
    powerupMult: 'Multiplies power-up drop chance.'
  };
  var PATTERN_HELP = {
    name: 'Name shown on the health bar during this phase.',
    color: 'Health bar and glow colour for this phase.',
    type: 'What this step does: wait, single, fan, radial, spiral, telegraph, summon, laser, dash.',
    time: 'How long this step lasts, in seconds.',
    count: 'How many bullets (or summoned enemies) this step produces.',
    spreadDeg: 'Width of the fan, in degrees.',
    speed: 'Speed of the bullets this step fires.',
    angleStep: 'How far the spiral advances between shots, in radians.',
    fireEvery: 'Seconds between shots within a spiral.',
    every: 'Seconds between shots in a homing barrage.'
  };

  // Renders one entry per key of a collection, each under its own subheading.
  // An entry may itself be an attack script (a bare array of steps), which gets
  // a heading per step rather than being labelled by index.
  function buildCollection(group, obj, defaults, rootPath, help) {
    Object.keys(obj).forEach(function (key) {
      var entry = obj[key];
      var path = rootPath + '.' + key;
      subhead(group, String((entry && entry.name) || (entry && entry.label) || key).toUpperCase());
      if (Array.isArray(entry)) {
        buildSteps(group, entry, defaults ? defaults[key] : undefined, path, key, help);
      } else {
        buildLeaves(group, entry, defaults ? defaults[key] : undefined, path, key, help);
      }
    });
  }

  function buildSteps(group, arr, defaults, path, prefix, help) {
    arr.forEach(function (step, i) {
      if (!step || typeof step !== 'object') return;
      subhead(group, prefix + ' — step ' + (i + 1) + (step.type ? ' (' + step.type + ')' : ''));
      buildLeaves(group, step, defaults ? defaults[i] : undefined, path + '.' + i,
                  prefix + ' ' + (i + 1), help, 1);
    });
  }

  // Walks an entry and emits a control for every editable leaf: numbers,
  // colours, strings, [min,max] pairs, and arrays of step objects (the boss
  // attack scripts). Functions are skipped — those are code, not tuning.
  function buildLeaves(group, obj, defaults, path, prefix, help, depth) {
    depth = depth || 0;
    if (!obj || typeof obj !== 'object') return;
    Object.keys(obj).forEach(function (k) {
      var v = obj[k];
      var dflt = defaults ? defaults[k] : undefined;
      var full = path + '.' + k;
      if (typeof v === 'function') return;

      // a [min, max] range pair
      if (Array.isArray(v) && v.length === 2 && typeof v[0] === 'number') {
        [0, 1].forEach(function (i) {
          var mag = Math.abs(dflt ? dflt[i] : v[i]) || 1;
          leafNumber(group, full + '.' + i, prefix + ' · ' + k + (i ? ' max' : ' min'),
            (help && (help[k] || help['*'])) || '', v[i], dflt ? dflt[i] : v[i], mag,
            function (nv) { v[i] = nv; });
        });
        return;
      }
      // a list of plain values, such as a planet's three possible surface colours
      if (Array.isArray(v) && v.length && typeof v[0] !== 'object') {
        v.forEach(function (item, i) {
          var itemPath = full + '.' + i;
          var itemDflt = dflt ? dflt[i] : item;
          var lbl = prefix + ' · ' + k + ' ' + (i + 1);
          if (isHexColor(item)) {
            colorControl(group, { label: lbl, key: itemPath, h: (help && help[k]) || '' }, item, itemDflt,
              function (hex) { v[i] = hex; api.setPath(itemPath, hex); if (hex === itemDflt) dropPath(itemPath); else savePath(itemPath, hex); },
              function (hex) { v[i] = hex; api.setPath(itemPath, hex); dropPath(itemPath); });
          } else if (typeof item === 'number') {
            leafNumber(group, itemPath, lbl, (help && (help[k] || help['*'])) || '',
              item, itemDflt, Math.abs(itemDflt) || 1, function (nv) { v[i] = nv; });
          } else if (typeof item === 'string') {
            textControl(group, { label: lbl, key: itemPath, h: (help && help[k]) || '' }, item, itemDflt,
              function (nv) { v[i] = nv; api.setPath(itemPath, nv); if (nv === itemDflt) dropPath(itemPath); else savePath(itemPath, nv); },
              function (nv) { v[i] = nv; api.setPath(itemPath, nv); dropPath(itemPath); });
          }
        });
        return;
      }
      // an attack script: an array of step objects
      if (Array.isArray(v)) {
        buildSteps(group, v, dflt, full, prefix + ' · ' + k, help);
        return;
      }
      if (v !== null && typeof v === 'object') {
        buildLeaves(group, v, dflt, full, prefix + ' · ' + k, help, depth + 1);
        return;
      }
      if (typeof v === 'number') {
        leafNumber(group, full, prefix + ' · ' + k, (help && (help[k] || help['*'])) || '',
          v, dflt === undefined ? v : dflt, Math.abs(dflt === undefined ? v : dflt) || 1,
          function (nv) { obj[k] = nv; });
        return;
      }
      if (isHexColor(v)) {
        colorControl(group, { label: prefix + ' · ' + k, key: full, h: (help && help[k]) || '' },
          v.length === 7 ? v : '#ffffff', dflt || v,
          function (hex) { api.setPath(full, hex); if (hex === dflt) dropPath(full); else savePath(full, hex); },
          function (hex) { api.setPath(full, hex); dropPath(full); });
        return;
      }
      if (typeof v === 'string') {
        textControl(group, { label: prefix + ' · ' + k, key: full, h: (help && help[k]) || '' }, v, dflt === undefined ? v : dflt,
          function (nv) { api.setPath(full, nv); if (nv === dflt) dropPath(full); else savePath(full, nv); },
          function (nv) { api.setPath(full, nv); dropPath(full); });
      }
    });
  }

  function leafNumber(group, full, label, helpText, value, dflt, mag, localSet) {
    var step = mag < 1 ? 0.001 : (mag < 3 ? 0.01 : (mag < 200 ? 1 : 1000));
    var max = +(Math.max(mag * 4, mag + 10)).toFixed(3);
    numberControl(group, { label: label, key: full, h: helpText, min: 0, max: max, step: step },
      value, dflt,
      function (nv) { localSet(nv); api.setPath(full, nv); if (nv === dflt) dropPath(full); else savePath(full, nv); },
      function (nv) { localSet(nv); api.setPath(full, nv); dropPath(full); });
  }

  // ---------- stage controls ----------
  function btn(parent, label, fn, title) {
    var b = document.createElement('button');
    b.textContent = label;
    if (title) b.title = title;
    b.addEventListener('click', fn);
    parent.appendChild(b);
    return b;
  }

  function buildStageBar() {
    var bar = document.getElementById('stageBar');
    var bar2 = document.getElementById('stageBar2');
    bar.innerHTML = ''; bar2.innerHTML = '';

    btn(bar, 'Level 1', function () { api.actions.start(1); });
    btn(bar, 'Level 2', function () { api.actions.start(2); });
    btn(bar, 'Level 3', function () { api.actions.start(3); });
    btn(bar, 'Restart', function () { api.actions.restart(); });
    btn(bar, 'Reload preview', function () { frame.src = frame.src; api = null; },
        'Reloads the game. Your settings are saved, so they come back with it.');

    var diff = document.createElement('select');
    ['veryeasy', 'easy', 'normal', 'hard', 'insane'].forEach(function (d) {
      var o = document.createElement('option'); o.value = d; o.textContent = d; diff.appendChild(o);
    });
    diff.value = 'normal';
    diff.addEventListener('change', function () { api.actions.setDifficulty(diff.value); });
    bar.appendChild(diff);

    var invOn = false;
    var invBtn = btn(bar, 'Invincible', function () {
      invOn = !invOn; api.actions.invincible(invOn); invBtn.classList.toggle('on', invOn);
    });
    var frzOn = false;
    var frzBtn = btn(bar, 'Freeze spawns', function () {
      frzOn = !frzOn; api.actions.freezeSpawns(frzOn); frzBtn.classList.toggle('on', frzOn);
    });

    var eSel = document.createElement('select');
    api.enemyKinds().forEach(function (k) {
      var o = document.createElement('option'); o.value = k; o.textContent = k; eSel.appendChild(o);
    });
    bar2.appendChild(eSel);
    btn(bar2, 'Spawn enemy', function () { api.actions.spawnEnemy(eSel.value); });

    var hSel = document.createElement('select');
    api.hazardTypes().forEach(function (k) {
      var o = document.createElement('option'); o.value = k; o.textContent = k; hSel.appendChild(o);
    });
    bar2.appendChild(hSel);
    btn(bar2, 'Spawn hazard', function () { api.actions.spawnHazard(hSel.value); });

    btn(bar2, 'Power-up', function () { api.actions.spawnPowerUp(); });
    btn(bar2, 'Mini-boss', function () { api.actions.spawnBoss(); });
    btn(bar2, 'Void Titan', function () { api.actions.spawnSuperboss(); });
    btn(bar2, '+5 ammo', function () { api.actions.giveBombs(5); });
    btn(bar2, '+9 lives', function () { api.actions.giveLives(9); });
    btn(bar2, 'Clear field', function () { api.actions.clearField(); });
    btn(bar2, 'Fleet battle now', function () { api.actions.skipToLevel2Battle(); });
    btn(bar2, 'Sunrise now', function () { api.actions.skipToLevel3Sunrise(); });

    var darkRow = document.createElement('span');
    darkRow.style.cssText = 'display:flex;align-items:center;gap:5px;font-size:12px;color:#8fa6d8';
    darkRow.innerHTML = '<span>darkness</span>';
    var dk = document.createElement('input');
    dk.type = 'range'; dk.min = 0; dk.max = 1; dk.step = 0.02; dk.value = 0;
    dk.style.width = '90px';
    dk.title = 'Force the level-3 darkness on at any time, to preview lighting without playing to it.';
    dk.addEventListener('input', function () { api.actions.setDark(parseFloat(dk.value)); });
    darkRow.appendChild(dk);
    bar2.appendChild(darkRow);
  }

  // ---------- live readout ----------
  function tick() {
    if (api) {
      try {
        var st = api.state();
        readout.textContent =
          st.fps + ' fps   ' + st.frameMs + ' ms   ' + st.canvasPx + ' px @ ' + st.dpr +
          '×   auto ' + st.autoScale + '\n' +
          'state ' + st.state + '   level ' + st.level + '   ' + st.difficulty +
          '   score ' + st.score + '   lives ' + st.lives + '   t ' + st.elapsed + 's   ammo ' + st.bombs + '\n' +
          'enemies ' + st.enemies + '   rocks ' + st.rocks + '   allies ' + st.allies +
          '   particles ' + st.particles + '   debris ' + st.debris +
          '   hazards [' + st.hazards.join(', ') + ']\n' +
          'dark ' + st.darkAmbient + '   lightRes ' + st.lightRes + '   lights ' + st.lights +
          '   occluders ' + st.occluders + '\n' +
          'L3 ' + st.level3State + '   L2boss ' + st.level2BossState + '   titan ' + st.superbossState +
          (st.boss ? '   boss ' + st.boss : '');
      } catch (e) { /* preview mid-reload */ }
    }
    requestAnimationFrame(tick);
  }

  // ---------- connect ----------
  function connect() {
    var w;
    try { w = frame.contentWindow; } catch (e) { w = null; }
    if (!w || !w.__editor) return false;
    api = w.__editor;
    panelBody.innerHTML = '';
    rows = [];
    buildPanel();
    buildStageBar();
    errBox.style.display = 'none';
    return true;
  }

  var tries = 0;
  function waitForGame() {
    if (connect()) return;
    if (++tries > 60) {
      errBox.style.display = 'block';
      errBox.innerHTML = 'Could not reach the game preview.<br><br>' +
        'If you opened this file straight from disk, the browser blocks the editor from ' +
        'talking to the iframe. Serve the folder over http instead — from the project ' +
        'folder run <code>python3 -m http.server</code> and open ' +
        '<code>http://localhost:8000/editor.html</code>. On the live site it works as-is.';
      return;
    }
    setTimeout(waitForGame, 250);
  }
  frame.addEventListener('load', function () { tries = 0; waitForGame(); });
  waitForGame();
  tick();

  // ---------- filter ----------
  document.getElementById('search').addEventListener('input', function (e) {
    var q = e.target.value.trim().toLowerCase();
    rows.forEach(function (r) {
      r.row.style.display = (!q || r.text.indexOf(q) !== -1) ? '' : 'none';
    });
    if (q) panelBody.querySelectorAll('details').forEach(function (d) { d.open = true; });
  });

  // ---------- presets, import / export / reset ----------
  var FAST = { maxPixelRatio: 1, renderScale: 0.85, glowQuality: 0, starDensity: 0.5, maxStars: 120,
               dustDensity: 0.4, maxDust: 140, bgCloudDensity: 0.5, fgCloudDensity: 0.5,
               maxParticles: 140, maxDebris: 80, lightRes: 0.35, maxShadowLights: 6,
               maxCastersPerLight: 5, starfieldStride: 3 };
  var PRETTY = { maxPixelRatio: 2, renderScale: 1, glowQuality: 1, starDensity: 1, maxStars: 320,
                 dustDensity: 1, maxDust: 500, bgCloudDensity: 1, fgCloudDensity: 1,
                 maxParticles: 600, maxDebris: 300, lightRes: 0.75, maxShadowLights: 22,
                 maxCastersPerLight: 14, starfieldStride: 1 };

  function applyPreset(preset) {
    Object.keys(preset).forEach(function (k) {
      if (!api.set(k, preset[k])) return;
      if (preset[k] === api.defaults[k]) dropTune(k); else saveTune(k, preset[k]);
    });
    connect();
  }
  document.getElementById('btnFast').addEventListener('click', function () { applyPreset(FAST); });
  document.getElementById('btnPretty').addEventListener('click', function () { applyPreset(PRETTY); });

  document.getElementById('btnExport').addEventListener('click', function () {
    var out = JSON.stringify({ tune: loadStore(TUNE_STORE), collections: loadStore(COLLECTION_STORE) }, null, 2);
    navigator.clipboard.writeText(out).then(function () {
      var b = document.getElementById('btnExport');
      var old = b.textContent; b.textContent = 'Copied ✓';
      setTimeout(function () { b.textContent = old; }, 1200);
    }, function () { window.prompt('Copy your tuning JSON:', out); });
  });

  document.getElementById('btnImport').addEventListener('click', function () {
    var txt = window.prompt('Paste tuning JSON:');
    if (!txt) return;
    var obj;
    try { obj = JSON.parse(txt); } catch (e) { alert('That is not valid JSON.'); return; }
    // Accept both the current {tune, collections} shape and the older flat one.
    var tunePart = obj.tune || obj;
    var colPart = obj.collections || {};
    Object.keys(tunePart).forEach(function (k) { if (api.set(k, tunePart[k])) saveTune(k, tunePart[k]); });
    Object.keys(colPart).forEach(function (p) { if (api.setPath(p, colPart[p])) savePath(p, colPart[p]); });
    connect();
  });

  document.getElementById('btnReset').addEventListener('click', function () {
    if (!confirm('Reset every setting — tuning, enemies, hazards, bosses — back to the built-in defaults?')) return;
    clearStores();
    api.resetTune();
    connect();
  });
})();
</script>
</body>
</html>
